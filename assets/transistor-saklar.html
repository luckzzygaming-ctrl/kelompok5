<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transistor sebagai Saklar 3D</title>
<style>
:root{--bg:#0d1420;--pn:rgba(18,27,42,.88);--tx:#e6edf7;--mu:#93a4bd;--ac:#4fc3f7;--ok:#6ee787;--bad:#ff7b72;--wr:#ffd54a;--bd:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dbe5f2;--pn:rgba(255,255,255,.9);--tx:#14202f;--mu:#51627a;--ac:#0a73b8;--ok:#1a7f37;--bad:#c62828;--wr:#9a6700;--bd:rgba(0,0,0,.16);color-scheme:light}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:12px;backdrop-filter:blur(8px)}
#info{position:absolute;left:10px;top:10px;padding:10px 12px;width:min(250px,62vw);z-index:5}
#info h1{font-size:14px;margin:0 0 6px}
.r{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:var(--mu)}.r b{color:var(--tx);font-variant-numeric:tabular-nums}
#st{padding:1px 8px;border-radius:99px;font-weight:700;font-size:12px}
.s0{background:var(--bad);color:#fff}.s1{background:var(--wr);color:#111}.s2{background:var(--ok);color:#06210d}
#hint{font-size:12px;color:var(--mu);margin-top:6px}
#tg{display:none;position:absolute;right:10px;top:10px;z-index:6}
#cap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:min(640px,92vw);padding:8px 14px;text-align:center;z-index:5;opacity:0;transition:opacity .4s;pointer-events:none}
#cap.on{opacity:1}
#bar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:8px;overflow-x:auto;z-index:7;align-items:center}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}button.a{background:var(--ac);color:#04121c;border-color:var(--ac)}
.sep{width:1px;align-self:stretch;background:var(--bd);flex:none}
label.v{display:flex;gap:6px;align-items:center;color:var(--mu);white-space:nowrap}
input[type=range]{width:90px;accent-color:var(--ac)}
.lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s;z-index:4;pointer-events:none}
#lt{top:0}#lb{bottom:0}.cine .lb{height:7vh}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:8px 14px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:640px){#tg{display:block}#info.c .r,#info.c #hint{display:none}#info{width:min(220px,60vw)}}
</style></head><body>
<div id="wrap">
<div class="lb" id="lt"></div><div class="lb" id="lb"></div>
<div id="info" class="pn"><h1>Transistor NPN sebagai Saklar</h1>
<div class="r"><span>Status</span><span id="st" class="s0">CUTOFF</span></div>
<div class="r"><span>Saklar input</span><b id="vs">OFF</b></div>
<div class="r"><span>Vbe</span><b id="vb">0 V</b></div>
<div class="r"><span>Arus basis Ib</span><b id="ib">0</b></div>
<div class="r"><span>Arus kolektor Ic</span><b id="ic">0</b></div>
<div class="r"><span>Vce</span><b id="vc">0</b></div>
<div class="r"><span>Jumlah LED beban</span><b id="nl">1</b></div>
<div id="hint">Klik saklar 3D atau tombol. Seret untuk memutar, gulir/cubit untuk zoom.</div></div>
<button id="tg" class="pn">Info</button>
<div id="cap" class="pn"></div><div id="toast" class="pn"></div>
<div id="bar" class="pn">
<button id="bSw">Saklar: OFF</button><button id="bTour">▶ Tour sinematis</button><span class="sep"></span>
<button id="bRot">Putar otomatis</button><button data-v="iso">Isometrik</button><button data-v="top">Atas</button><button data-v="front">Depan</button><button id="bLab" class="a">Label</button><span class="sep"></span>
<button data-add="led">+ LED</button><button data-add="res">+ Resistor</button><button data-add="tr">+ Transistor</button><button id="bUndo">Hapus terakhir</button><span class="sep"></span>
<label class="v">Vcc <input type="range" id="vcc" min="3" max="12" step=".5" value="9"><b id="vv" style="color:var(--tx)">9 V</b></label><span class="sep"></span>
<button id="bShot">📷 Screenshot PNG</button><button id="bReset">↺ Reset</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=i=>document.getElementById(i),V=(x,y,z)=>new THREE.Vector3(x,y,z);
const wrap=$('wrap'),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));wrap.prepend(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);
ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.495;ctl.minDistance=4;ctl.maxDistance=32;ctl.autoRotateSpeed=1.5;
const HOME={p:[9,8,10],t:[0,0,0]};cam.position.set(...HOME.p);
const mq=matchMedia('(prefers-color-scheme: light)');
const theme=()=>scene.background=new THREE.Color(mq.matches?0xdbe5f2:0x0d1420);theme();mq.addEventListener('change',theme);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(6,12,8);scene.add(dl);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o));
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const GL=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.4,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
/* papan */
scene.add(mesh(new THREE.BoxGeometry(15,.4,10),M(0x1b6b3a),0,-.2,0));
const main=new THREE.Group();scene.add(main);const extras=new THREE.Group();scene.add(extras);
/* jalur kawat */
const L=[V(-5.5,.5,-1),V(-5.5,.5,-3.5),V(2.4,.5,-3.5),V(2.4,.5,0)],E=[V(1.6,.5,0),V(1.6,.5,1),V(-5.5,.5,1)],B=[V(-4.5,.5,-3.5),V(-4.5,.5,-2.2),V(2,.5,-2.2),V(2,.5,0)];
const wm=M(0xd9a441,{metalness:.6,roughness:.35});
function wire(p,g=main){const c=new THREE.CurvePath();for(let i=1;i<p.length;i++)c.add(new THREE.LineCurve3(p[i-1],p[i]));g.add(mesh(new THREE.TubeGeometry(c,64,.07,8),wm));}
[L,E,B].forEach(p=>wire(p));
function mkPath(pts){const s=[];let n=0;for(let i=1;i<pts.length;i++){const l=pts[i-1].distanceTo(pts[i]);s.push([pts[i-1],pts[i],l,n]);n+=l}
return{len:n,at(d,o){d=((d%n)+n)%n;for(const[a,b,l,c]of s)if(d<=c+l)return o.lerpVectors(a,b,(d-c)/l);return o}}}
function flow(pts,n,col){const P=mkPath(pts),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
const o=new THREE.Points(g,new THREE.PointsMaterial({map:GL,color:col,size:.5,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));o.frustumCulled=false;scene.add(o);return{P,o,n,s:0}}
const fC=flow(L.concat(E),26,0xffd54a),fB=flow(B.concat(E),14,0x6ee7ff);
/* komponen */
function label(t,x,y,z){const c=document.createElement('canvas');c.width=320;c.height=72;const g=c.getContext('2d');g.fillStyle='rgba(10,16,26,.85)';g.beginPath();g.roundRect?g.roundRect(4,8,312,56,14):g.rect(4,8,312,56);g.fill();g.fillStyle='#e6edf7';g.font='bold 28px system-ui,sans-serif';g.textAlign='center';g.fillText(t,160,47);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.position.set(x,y,z);s.scale.set(2.6,.58,1);labels.add(s)}
const labels=new THREE.Group();scene.add(labels);
function resistor(x,z,cols,g){const r=new THREE.Group();r.position.set(x,.5,z);
const b=mesh(new THREE.CylinderGeometry(.2,.2,.9,16),M(0xd8b98a));b.rotation.z=Math.PI/2;r.add(b);
cols.forEach((c,i)=>{const k=mesh(new THREE.CylinderGeometry(.21,.21,.07,16),M(c));k.rotation.z=Math.PI/2;k.position.x=-.27+i*.17;r.add(k)});g.add(r);return r}
const leds=[],mainLight=new THREE.PointLight(0xff3b30,0,6);
function makeLED(x,z,col,g){const r=new THREE.Group();r.position.set(x,0,z);
const m=M(col,{emissive:col,emissiveIntensity:.1,transparent:true,opacity:.88});
r.add(mesh(new THREE.CylinderGeometry(.38,.38,.15,20),M(0x888888),0,.08,0),mesh(new THREE.CylinderGeometry(.3,.3,.5,20),m,0,.4,0),mesh(new THREE.SphereGeometry(.3,20,12,0,Math.PI*2,0,Math.PI/2),m,0,.65,0));
const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:GL,color:col,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));gl.position.y=.8;gl.scale.set(2.2,2.2,1);r.add(gl);
g.add(r);const o={r,m,gl};leds.push(o);return o}
function transistor(x,z,g){const t=new THREE.Group();t.position.set(x,0,z);const k=M(0x1a1a1f,{roughness:.6});
t.add(mesh(new THREE.CylinderGeometry(.5,.5,.9,24,1,false,Math.PI/2,Math.PI),k,0,1.35,0),mesh(new THREE.BoxGeometry(1,.9,.02),M(0x2a2a30),0,1.35,0));
[-.4,0,.4].forEach(dx=>t.add(mesh(new THREE.CylinderGeometry(.04,.04,.95,8),M(0xcfd3d8,{metalness:.8}),dx,.45,0)));g.add(t);return t}
/* baterai */
const bat=new THREE.Group();bat.position.set(-5.5,0,0);
bat.add(mesh(new THREE.BoxGeometry(1.4,1,1.4),M(0x222a38),0,.5,0),mesh(new THREE.BoxGeometry(1.42,.25,1.42),M(0xffb300),0,.8,0),mesh(new THREE.CylinderGeometry(.18,.18,.6,12),M(0xd32f2f),0,.3,-1),mesh(new THREE.CylinderGeometry(.18,.18,.6,12),M(0x111111),0,.3,1));main.add(bat);
/* saklar */
const sw=new THREE.Group();sw.position.set(-3,0,-2.2);const lever=new THREE.Group();lever.position.y=.3;const knob=mesh(new THREE.SphereGeometry(.12,12,8),M(0xff7b72,{emissive:0x000000}),0,.65,0);
lever.add(mesh(new THREE.BoxGeometry(.16,.6,.16),M(0xeeeeee),0,.3,0),knob);
sw.add(mesh(new THREE.BoxGeometry(1,.3,.9),M(0x3a4252),0,.15,0),mesh(new THREE.BoxGeometry(.5,.05,.16),M(0x111111),0,.32,0),lever);main.add(sw);
resistor(-.5,-2.2,[0x6d4c41,0x111111,0xff9800],main);resistor(-2,-3.5,[0xff9800,0xff9800,0x6d4c41],main);
transistor(2,0,main);makeLED(2.4,-3,0xff3b30,main);main.children[main.children.length-1].add(mainLight);mainLight.position.y=1;
[['BATERAI',-5.5,1.9,0],['SAKLAR',-3,1.7,-2.2],['Rb 10 kΩ',-.5,1.1,-2.2],['Rc 330 Ω',-2,1.1,-3.5],['Q1 NPN',2,2.5,0],['LED',2.4,1.9,-3]].forEach(a=>label(...a));
/* fisika */
let on=false;const BETA=80,RB=1e4,RC=330,VF=2;
function solve(){const v=+$('vcc').value,N=leds.length;let Ib=0,Ic=0,Vce=v,st=0;
if(on){Ib=(v-.7)/RB;const sat=N*Math.max(0,(v-VF-.2)/RC);Ic=Math.min(BETA*Ib,sat);st=BETA*Ib>=sat?2:1;Vce=Math.max(.2,v-VF-Ic*RC/N)}return{v,N,Ib,Ic,Vce,st}}
const mA=a=>(a*1000).toFixed(a<.001?3:1)+' mA';
function setSw(v){on=v;$('bSw').textContent='Saklar: '+(on?'ON':'OFF');$('bSw').classList.toggle('a',on)}
/* tween & tour */
let tw=null,tour=null;const sm=k=>k*k*(3-2*k);
function fly(p,t,d=1.2){tw={fp:cam.position.clone(),ft:ctl.target.clone(),tp:V(...p),tt:V(...t),t:0,d}}
const STOPS=[{p:[9,8,10],t:[0,0,0],x:'Transistor NPN dipakai sebagai saklar elektronik: arus kecil mengendalikan arus besar.',s:0},
{p:[-9,3.5,5],t:[-5.5,.5,0],x:'Baterai memberi tegangan Vcc untuk jalur basis dan jalur beban.'},
{p:[-1,3.4,2],t:[-1.5,.5,-2.5],x:'Saklar kecil dan Rb menentukan arus basis Ib yang sangat kecil.',s:0},
{p:[1,2.8,4.4],t:[2,1,0],x:'Saklar ON: Ib mengalir ke basis, jalur kolektor–emitor menghantar (saturasi).',s:1},
{p:[6.8,3.2,-1.5],t:[2.4,.5,-2.5],x:'Arus kolektor besar mengalir lewat LED, LED menyala = saklar tertutup.'},
{p:[8,5,7],t:[1,0,-1],x:'Saklar OFF: Ib = 0, transistor cutoff, LED padam = saklar terbuka.',s:0},
{p:[9,8,10],t:[0,0,0],x:'Tour selesai. Coba tambah LED sampai transistor keluar dari saturasi.'}];
function nextStop(){tour.i++;if(tour.i>=STOPS.length)return stopTour();tour.t=0;tour.f={p:cam.position.clone(),t:ctl.target.clone()};const s=STOPS[tour.i];cap(s.x);if(s.s!==undefined)setSw(!!s.s)}
function startTour(){if(tour)return stopTour();tw=null;ctl.enabled=false;ctl.autoRotate=false;$('bRot').classList.remove('a');wrap.classList.add('cine');$('bTour').textContent='■ Hentikan tour';tour={i:-1,t:0};nextStop()}
function stopTour(){tour=null;ctl.enabled=true;wrap.classList.remove('cine');$('bTour').textContent='▶ Tour sinematis';setTimeout(()=>{if(!tour)cap('')},3000)}
function cap(t){const c=$('cap');c.textContent=t;c.classList.toggle('on',!!t)}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
/* objek tambahan */
const stack=[],SL=[];for(const z of[3.4,4.3])for(let x=-4.5;x<=6;x+=1.75)SL.push([x,z]);const used=new Set();
const RC_=[0xf44336,0x4caf50,0x2196f3,0xffeb3b,0x9c27b0],LZ=[-2.2,-1.1,0],LC=[0xffa000,0x66bb6a,0x42a5f5];
function add(type){let o;
if(type==='led'){const n=stack.filter(s=>s.t==='led').length;if(n>=3)return toast('Maksimal 3 LED tambahan (paralel)');const z=LZ[n],g=new THREE.Group();extras.add(g);wire([V(2.4,.5,z),V(4.6,.5,z)],g);makeLED(4.6,z,LC[n],g);o={t:'led',g,led:leds[leds.length-1]}}
else{const i=SL.findIndex((s,k)=>!used.has(k));if(i<0)return toast('Papan penuh');used.add(i);const g=new THREE.Group();extras.add(g);
if(type==='res')resistor(SL[i][0],SL[i][1],[0,1,2].map(()=>RC_[Math.random()*5|0]),g);else transistor(SL[i][0],SL[i][1],g);o={t:type,g,i}}
o.g.userData.b=performance.now();o.g.scale.setScalar(.01);stack.push(o)}
function undo(){const o=stack.pop();if(!o)return toast('Belum ada objek tambahan');extras.remove(o.g);if(o.t==='led')leds.pop();else used.delete(o.i)}
/* UI */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('bUndo').onclick=undo;$('bSw').onclick=()=>setSw(!on);
const VW={iso:[HOME.p,HOME.t],top:[[0,17,.01],[0,0,0]],front:[[0,4.5,15],[0,0,0]]};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(tour)return toast('Hentikan tour terlebih dahulu');fly(...VW[b.dataset.v])});
$('bRot').onclick=()=>{if(tour)return;ctl.autoRotate=!ctl.autoRotate;$('bRot').classList.toggle('a',ctl.autoRotate)};
$('bLab').onclick=()=>{labels.visible=!labels.visible;$('bLab').classList.toggle('a',labels.visible)};
$('bTour').onclick=startTour;$('tg').onclick=()=>$('info').classList.toggle('c');if(innerWidth<=640)$('info').classList.add('c');
$('vcc').oninput=e=>$('vv').textContent=e.target.value+' V';
$('bReset').onclick=()=>{if(tour)stopTour();cap('');while(stack.length)undo();setSw(false);$('vcc').value=9;$('vv').textContent='9 V';ctl.autoRotate=false;$('bRot').classList.remove('a');labels.visible=true;$('bLab').classList.add('a');fly(HOME.p,HOME.t,1);toast('Simulasi di-reset')};
$('bShot').onclick=()=>{renderer.render(scene,cam);renderer.domElement.toBlob(async b=>{if(!b)return toast('Gagal membuat gambar');const f='transistor-saklar-'+Date.now()+'.png';
try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:f,data:b});toast('Screenshot PNG disimpan')}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;document.body.appendChild(a);a.click();a.remove();toast('Screenshot PNG diunduh')}}catch(e){toast('Penyimpanan dibatalkan')}},'image/png')};
/* klik saklar 3D */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let dn=null;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);if(ray.intersectObject(sw,true).length)setSw(!on)});
/* resize */
function size(){const w=wrap.clientWidth||innerWidth,h=wrap.clientHeight||innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?65:45;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(wrap);addEventListener('resize',size);size();
/* loop */
let last=performance.now(),key='';const tmp=V(0,0,0);
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(tour){const s=STOPS[tour.i];tour.t+=dt;const e=sm(Math.min(1,tour.t/3));cam.position.lerpVectors(tour.f.p,V(...s.p),e);ctl.target.lerpVectors(tour.f.t,V(...s.t),e);if(tour.t>5.2)nextStop()}
else if(tw){tw.t+=dt;const e=sm(Math.min(1,tw.t/tw.d));cam.position.lerpVectors(tw.fp,tw.tp,e);ctl.target.lerpVectors(tw.ft,tw.tt,e);if(tw.t>=tw.d)tw=null}
ctl.update();
const S=solve();
const k=[on,S.v,S.N,S.st].join();if(k!==key){key=k;const st=$('st');st.className='s'+S.st;st.textContent=['CUTOFF (terbuka)','AKTIF (linear)','SATURASI (tertutup)'][S.st];$('vs').textContent=on?'ON':'OFF';$('vb').textContent=on?'≈ 0,7 V':'0 V';$('ib').textContent=mA(S.Ib);$('ic').textContent=mA(S.Ic);$('vc').textContent=S.Vce.toFixed(2)+' V';$('nl').textContent=S.N}
const br=on?Math.min(1,S.Ic/S.N/.02):0;
leds.forEach(l=>{l.m.emissiveIntensity=.1+br*1.7;l.gl.material.opacity=br*.9});mainLight.intensity=br*1.6;
lever.rotation.z+=((on?-.5:.5)-lever.rotation.z)*Math.min(1,dt*12);knob.material.color.setHex(on?0x6ee787:0xff7b72);
[[fC,S.Ic>0?2+S.Ic*50:0],[fB,S.Ib>0?1+S.Ib*1000:0]].forEach(([f,v])=>{f.o.visible=v>0;if(v>0){f.s+=v*dt;const a=f.o.geometry.attributes.position;for(let i=0;i<f.n;i++){f.P.at(f.s+i*f.P.len/f.n,tmp);a.setXYZ(i,tmp.x,tmp.y+.05,tmp.z)}a.needsUpdate=true}});
extras.children.forEach(g=>{const t=(now-g.userData.b)/450;if(t<1){const c=1.70158,u=t-1;g.scale.setScalar(Math.max(.01,1+(c+1)*u*u*u+c*u*u))}else g.scale.setScalar(1)});
renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
